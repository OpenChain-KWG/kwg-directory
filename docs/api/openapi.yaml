                $ref: '#/components/schemas/Error'
        '500':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/upload/avatar:
    post:
      summary: 아바타 이미지 업로드(multipart). 2MB·JPEG/PNG/WebP.
      tags:
        - upload
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 업로드됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUploadResult'
        '400':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
