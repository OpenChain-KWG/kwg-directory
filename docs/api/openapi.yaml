        '500':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authjs.session-token
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Success:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
        uptime:
          type: integer
        timestamp:
          type: string
          format: date-time
        version:
          type: string
      required:
        - status
        - uptime
        - timestamp
        - version
    Member:
      type: object
      properties:
        id:
          type: string
          format: uuid
