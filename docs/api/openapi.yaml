# 이 파일은 자동 생성됩니다. 직접 수정 금지.
# 원천: src/lib/openapi.ts — `node scripts/gen-openapi.mjs` 로 재생성.
openapi: 3.1.0
info:
  title: KWG Directory API
  version: 0.1.0
  description: OpenChain Korea Work Group 멤버 주소록 REST API. 인증은 next-auth 세션 쿠키 기반. /api/auth/* 는 next-auth 내부 핸들러로 본 문서 범위 밖.
  license:
    name: Apache-2.0
servers:
  - url: /
    description: 동일 오리진
tags:
  - name: system
    description: 시스템·헬스
  - name: members
    description: 멤버 디렉토리
  - name: me
    description: 내 데이터(GDPR)
  - name: upload
    description: 파일 업로드
  - name: admin
    description: 운영진 전용
paths:
  /api/health:
    get:
      summary: 헬스 체크 — 가용성 모니터링용
      tags:
        - system
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/members:
    get:
      summary: 승인된 멤버 목록(페이지네이션). 비로그인 시 연락처 redact.
      tags:
        - members
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: category
          in: query
          schema:
            type: string
        - name: tags
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 멤버 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListPaged'
        '500':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: 내 프로필 생성(가입). 로그인 필요.
      tags:
        - members
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreate'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/members/search:
    get:
      summary: 멤버 검색·필터·정렬(페이지네이션).
      tags:
        - members
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: category
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - name
              - recent
              - random
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSearchResult'
        '400':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/members/{id}:
    get:
      summary: 멤버 단건 조회. 비로그인 시 연락처 redact.
      tags:
        - members
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 멤버
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '404':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: 멤버 부분 수정. 본인만.
      tags:
        - members
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberPatch'
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: 멤버 삭제. 본인만.
      tags:
        - members
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 삭제됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '401':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/members/me:
