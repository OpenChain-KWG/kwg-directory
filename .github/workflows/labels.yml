name: Sync Labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml

jobs:
  sync-labels:
    name: Sync GitHub Labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 라벨 동기화
        uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
